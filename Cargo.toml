[package]
name = "uget"
version = "0.1.10-beta.1"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/uget"
homepage = "https://ararog.github.io/uget"
description = "A minimal cli tool to make http requests. You want, you get!"
readme = "README.md"
license = "MIT"
keywords = ["http", "networking", "client", "fetch", "rest"]
publish = true
rust-version = "1.75.0"

[package.metadata.wix]
upgrade-guid = "17814438-FF90-4394-8ABD-98DA4923CAB7"
path-guid = "04B654F3-7BD9-4F46-92DA-128844158CAE"
license = false
eula = false

[features]
default = ["http2", "http3", "rust-tls"]

rust-tls = [
    "deboa-tokio/rust-tls",
    "deboa-tokio/default-rustls-provider",
    "deboa-tokio/default-rustls-verifier",
]
native-tls = ["deboa-tokio/native-tls"]

http2 = ["deboa-tokio/http2"]
http3 = ["deboa-tokio/http3"]

[dependencies]
clap = { version = "4.6.6", features = [
    "derive",
    "std",
], default-features = false }
colored = "3.1.1"
colored_json = "5.0.0"
#deboa = { path = "../deboa/deboa", default-features = false }
deboa = { version = "0.1.5-beta.2", default-features = false }
#deboa-extras = { path = "../deboa-contrib/deboa-extras", default-features = false, features = [
#    "json",
#    "xml",
#    "hooks",
#    "sse",
#] }
deboa-extras = { version = "0.1.1-beta.2", default-features = false, features = [
    "json",
    "xml",
    "hooks",
    "sse",
] }
#deboa-tokio = { path = "../deboa-tokio/deboa-tokio", optional = true, default-features = false }
deboa-tokio = { version = "0.1.4-beta.3", optional = true, default-features = false }
futures-util = "0.3.31"
http = "1.5.0"
http-body-util = "0.1.5"
indicatif = { version = "0.18.4", features = [
    "unicode-width",
], default-features = false }
mime = "0.3.17"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
], default-features = false }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
